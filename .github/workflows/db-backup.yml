# Daily encrypted Supabase backup.
#
# The Supabase free plan has no backups. This job dumps the database every day, encrypts the
# dump, and keeps it as a workflow artifact for 90 days.
#
# It stays switched off (the run succeeds and does nothing) until both secrets below are added
# in Settings > Secrets and variables > Actions:
#   SUPABASE_DB_URL     Session pooler connection string from Supabase (Connect > Session pooler).
#                       GitHub runners have no IPv6, so the direct connection string will not work.
#   BACKUP_PASSPHRASE   Any long password. The dump is encrypted with it, so it is safe even in a
#                       public repository. Keep a copy somewhere safe: without it the backups
#                       cannot be opened.
#
# Restore: download the artifact, then
#   gpg --batch --passphrase "<BACKUP_PASSPHRASE>" -d backup-YYYY-MM-DD.sql.gz.gpg | gunzip > backup.sql

name: Daily database backup

on:
  schedule:
    - cron: '30 1 * * *'   # every day at 04:30 Cairo time
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check that backups are set up
        id: setup
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backups are not set up yet: add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.setup.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, compress and encrypt
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%d)
          # public holds the inventory tables; auth holds the user accounts
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=auth --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" -o "backup-$STAMP.sql.gz.gpg"
          ls -lh "backup-$STAMP.sql.gz.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Keep the encrypted backup for 90 days
        if: steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
