# Keeps the Supabase project from being paused.
#
# The Supabase free plan pauses a project after one week without database activity. This job
# runs a small read query through the project's API twice a day, which counts as activity.
# With row-level security on, the anonymous key reads zero rows, but the query still runs.
#
# Uses the two secrets the deploy workflow already has: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
#
# Note: GitHub turns off scheduled workflows in a PUBLIC repository after 60 days with no
# commits. Making the repository private avoids that.

name: Keep Supabase active

on:
  schedule:
    - cron: '17 3,15 * * *'   # 06:17 and 18:17 Cairo time
  workflow_dispatch:           # manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/locations?select=id&limit=1")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally (HTTP $status). The project may be paused: resume it from the Supabase dashboard."
            exit 1
          fi
